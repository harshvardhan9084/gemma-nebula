# Extraction pipeline (v5.5) on the public runner.
#
# Manual dispatch - needs repo secrets:
#   SUPABASE_URL          https://qnakqtiokspzoopivfyl.supabase.co
#   SUPABASE_SERVICE_KEY  service/secret key (server-side only)
#   GEMMA_API_KEYS        comma-separated AI Studio keys
#   REPO_A_PAT            (only for pdf_dir starting with repo-a/) fine-grained
#                         PAT with read access to harshvardhan9084/aktu-pyq
#
# True 2-way sharding (both matrix legs get a non-empty half of the PDFs).
# Idempotent: papers already 'complete' in Supabase (file_hash) are skipped;
# review/failed rows are retried with --ai (transient AI failures heal).
#
# UNATTENDED CHAIN: stage=all rounds re-dispatch themselves via the `post`
# job while tools/remaining.py > 0 (capped at 30 iterations). The scrape
# workflow's collect job fires the first round (iter=0) when the round-3
# download finishes, so expansion runs end-to-end without human input.
#
# pdf_dir prefix repo-a/ = corpus lives in Repo A (aktu-pyq, private):
# the checkout step below pulls it with REPO_A_PAT and paths become
# repo-a/corpus/... e.g. repo-a/corpus/unstructured + repo-a/data/aktu-pyq_manifest.csv
name: extraction

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'extract | enrich | repair | embed | cluster | all'
        default: 'extract'
        type: string
      pilot_n:
        description: 'run on next N unfinished PDFs (0 = all)'
        default: '0'
        type: string
      pdf_dir:
        description: 'PDF directory (repo-a/ prefix = fetch from Repo A)'
        default: 'corpus/aktuonline3'
        type: string
      manifest:
        description: 'manifest csv (fills source_url/provenance)'
        default: 'data/aktuonline3_manifest.csv'
        type: string
      iter:
        description: 'chain iteration counter (auto-managed)'
        default: '0'
        type: string
      not_before:
        description: 'UTC HH:MM - hold extraction until then (e.g. AI free-tier RPD reset 07:00Z). Empty = start now.'
        default: ''
        type: string

permissions: {}

concurrency:
  group: aktu-extract
  cancel-in-progress: false

jobs:
  hold:
    # Optional quota window: burns the wait in its OWN job so the extract
    # job's 350-min budget starts fresh afterwards.
    if: ${{ github.event.inputs.not_before != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - name: Hold until UTC time
        run: |
          T="${{ github.event.inputs.not_before }}"
          TARGET=$(date -u -d "$T" +%s)
          NOW=$(date -u +%s)
          D=$((TARGET - NOW))
          if [ "$D" -gt 0 ] && [ "$D" -lt 10800 ]; then
            echo "holding $D s until $T UTC (AI free-tier quota window)"
            sleep "$D"
            echo "hold complete at $(date -u +%H:%M)Z - quota should be reset"
          else
            echo "not_before passed/out-of-range ($D s) - continuing immediately"
          fi

  extract:
    needs: hold
    if: ${{ !cancelled() && (needs.hold.result == 'success' || needs.hold.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { shard: 0, shards: 2 }
          - { shard: 1, shards: 2 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Checkout Repo A corpus (aktu-pyq) when pdf_dir starts with repo-a/
        if: ${{ startsWith(github.event.inputs.pdf_dir || 'corpus/aktuonline3', 'repo-a/') }}
        uses: actions/checkout@v4
        with:
          repository: harshvardhan9084/aktu-pyq
          ref: main
          token: ${{ secrets.REPO_A_PAT }}
          path: repo-a

      - name: Preflight secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::Secrets missing. Add SUPABASE_URL, SUPABASE_SERVICE_KEY, GEMMA_API_KEYS in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Paper-wise ${{ github.event.inputs.stage }} (shard ${{ matrix.shard }})
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GEMMA_API_KEYS: ${{ secrets.GEMMA_API_KEYS }}
        run: |
          set -x
          STAGE="${{ github.event.inputs.stage || 'extract' }}"
          PILOT=""
          N="${{ github.event.inputs.pilot_n }}"
          if [ -n "$N" ] && [ "$N" != "0" ]; then PILOT="--pilot $N"; fi
          SHARD_ARGS="--shard ${{ matrix.shard }} --shards 2"
          if [ "$STAGE" != "extract" ] && [ "$STAGE" != "all" ]; then
            # DB-wide stages are not shardable - single leg does the work
            if [ "${{ matrix.shard }}" = "1" ]; then
              echo "stage $STAGE runs on shard 0 only"
              exit 0
            fi
            SHARD_ARGS=""
          fi
          python3 pipeline/aktu_pyq_extractor.py \
            --stage "$STAGE" \
            --dir "${{ github.event.inputs.pdf_dir || 'corpus/aktuonline3' }}" \
            --manifest "${{ github.event.inputs.manifest || 'data/aktuonline3_manifest.csv' }}" \
            --ai --db --soft-deadline 285 $SHARD_ARGS $PILOT

  post:
    needs: extract
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install -q requests

      - name: Count remaining + chain dispatch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GH_TOKEN: ${{ github.token }}
          STAGE: ${{ github.event.inputs.stage || 'extract' }}
          PILOT_N: ${{ github.event.inputs.pilot_n || '0' }}
          PDF_DIR: ${{ github.event.inputs.pdf_dir || 'corpus/aktuonline3' }}
          ITER: ${{ github.event.inputs.iter || '0' }}
        run: |
          set -e
          echo "### Chain status" >> $GITHUB_STEP_SUMMARY
          if [ "$STAGE" != "all" ] || [ "$PILOT_N" != "0" ]; then
            echo "stage=$STAGE pilot=$PILOT_N - not a chain round, no re-dispatch" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          REMAIN=$(python3 tools/remaining.py --dir "$PDF_DIR")
          echo "remaining PDFs not complete: $REMAIN (iter $ITER/30)" >> $GITHUB_STEP_SUMMARY
          if [ "$REMAIN" -gt 0 ] && [ "$ITER" -lt 30 ]; then
            NEXT=$((ITER + 1))
            echo "re-dispatching extraction round $NEXT" >> $GITHUB_STEP_SUMMARY
            gh api -X POST "repos/${{ github.repository }}/actions/workflows/extraction.yml/dispatches" \
              -f ref=aktu-runner \
              -f 'inputs[stage]=all' -f 'inputs[pilot_n]=0' \
              -f "inputs[pdf_dir]=$PDF_DIR" \
              -f 'inputs[manifest]=data/aktuonline3_manifest.csv' \
              -f "inputs[iter]=$NEXT"
          elif [ "$REMAIN" -gt 0 ]; then
            echo "::warning::iteration cap (30) reached with $REMAIN still unfinished - chain stopped, manual attention needed" >> $GITHUB_STEP_SUMMARY
          else
            echo "EXPANSION COMPLETE - all PDFs in $PDF_DIR are extraction_status=complete" >> $GITHUB_STEP_SUMMARY
          fi
